<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data: 'unsafe-inline'; media-src 'self' file:;">
<title>Audiora</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">

    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
            <path d="M9 18V5l12-2v13" stroke="url(#g1)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="6" cy="18" r="3" stroke="url(#g1)" stroke-width="1.6"/>
            <circle cx="18" cy="16" r="3" stroke="url(#g1)" stroke-width="1.6"/>
            <defs>
              <linearGradient id="g1" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                <stop stop-color="#a78bfa"/>
                <stop offset="1" stop-color="#38bdf8"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <span>Audiora</span>
      </div>

      <div class="actions">
        <button id="openFilesBtn" class="action-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Add Files
        </button>
        <button id="openFolderBtn" class="action-btn action-btn--ghost">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          Add Folder
        </button>
      </div>

      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input id="searchInput" type="text" placeholder="Search your library…" autocomplete="off" />
      </div>

      <div class="playlist-meta">
        <span id="trackCount">0 tracks</span>
        <button id="clearBtn" class="text-btn">Clear</button>
      </div>

      <ul id="playlist" class="playlist">
        <li class="empty-state" id="emptyState">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path d="M9 18V5l12-2v13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="1.4"/><circle cx="18" cy="16" r="3" stroke="currentColor" stroke-width="1.4"/></svg>
          <p>Your library is empty</p>
          <span>Add files or a folder to get started</span>
        </li>
      </ul>
    </aside>

    <main class="player">
      <div class="now-playing">
        <div class="art" id="albumArt">
          <svg width="46" height="46" viewBox="0 0 24 24" fill="none"><path d="M9 18V5l12-2v13" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="1.3"/><circle cx="18" cy="16" r="3" stroke="currentColor" stroke-width="1.3"/></svg>
        </div>

        <div class="visualizer-wrap">
          <canvas id="visualizer"></canvas>
        </div>

        <h2 id="trackTitle">No track selected</h2>
        <p id="trackArtist">Add some music to begin</p>
      </div>

      <div class="progress-row">
        <span id="currentTime" class="time">0:00</span>
        <input type="range" id="seekBar" class="slider" value="0" min="0" max="100" step="0.1" />
        <span id="duration" class="time">0:00</span>
      </div>

      <div class="controls">
        <button id="shuffleBtn" class="ctrl-btn" title="Shuffle">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M16 3h5v5M4 20 20 4M21 16v5h-5M15 15l6 6M4 4l5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="prevBtn" class="ctrl-btn" title="Previous">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM10 12l9-7v14z"/></svg>
        </button>
        <button id="rewindBtn" class="ctrl-btn" title="Rewind 10s">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M4 12a8 8 0 1 1 3 6.3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M4 6v5h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="12" y="15.5" font-size="7.5" font-weight="700" fill="currentColor" text-anchor="middle" font-family="sans-serif">10</text></svg>
        </button>
        <button id="playBtn" class="ctrl-btn ctrl-btn--main" title="Play/Pause">
          <svg id="playIcon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pauseIcon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
        </button>
        <button id="nextBtn" class="ctrl-btn" title="Next">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM5 12l9-7v14z"/></svg>
        </button>
        <button id="repeatBtn" class="ctrl-btn" title="Repeat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M17 2l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="repeatOneDot" class="repeat-dot" style="display:none"></span>
        </button>
      </div>

      <div class="volume-row">
        <svg id="volumeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 5V4L8 9H4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M16.5 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input type="range" id="volumeBar" class="slider slider--volume" value="80" min="0" max="100" />
      </div>
    </main>
  </div>

  <audio id="audio" preload="metadata"></audio>
  <script src="js/renderer.js"></script>
</body>
</html>
